name: Cardápio diário

on:
  # 10:00 em Brasília (UTC-3) = 13:00 UTC. Ajustar aqui se o horário de
  # envio precisar mudar (lembrando do offset de -3h em relação ao UTC).
  schedule:
    - cron: "0 13 * * *"
  workflow_dispatch: {}

jobs:
  enviar-cardapio:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Instalar Python
        run: uv python install

      - name: Instalar dependências
        run: uv sync --frozen

      - name: Instalar Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Rodar o bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_CHAT_ID_SAUDE_DIREITO: ${{ secrets.TELEGRAM_CHAT_ID_SAUDE_DIREITO }}
        run: uv run python -m bandeco_alert.main
